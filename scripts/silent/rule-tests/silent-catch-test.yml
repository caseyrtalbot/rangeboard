id: silent-catch
valid:
  - 'try { x() } catch (error) { report(error); return null }'
  - 'try { x() } catch (error) { throw new Error("x failed", { cause: error }) }'
  - 'try { x() } catch (error) { adapter.reportWriteFailure(error) }'
  - 'try { x() } catch (error) { return { ok: false, error: String(error) } }'
  - 'try { x() } catch (e) { v = recover(e) }'
  - 'try { x() } catch (e) { lastError = e }'
  - 'try { x() } catch (error) { this.error = error }'
invalid:
  - 'try { x() } catch { return null }'
  - 'try { x() } catch (error) { return idle }'
  - 'try { x() } catch { return { entries: [], error: "unreadable" } }'
  - 'try { x() } catch { return new Map() }'
  - 'try { x() } catch { return await fallback }'
  - 'for (const r of rows) { try { p(r) } catch { continue } }'
  - 'for (const r of rows) { try { p(r) } catch { break } }'
  - 'try { q() } catch { v = null }'
  - 'try { q() } catch (e) { void e }'
