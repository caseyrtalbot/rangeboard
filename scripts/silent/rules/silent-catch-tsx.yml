id: silent-catch-tsx
message: Catch block returns a substitute value without reporting, rethrowing, or recording.
severity: error
language: Tsx
rule:
  kind: catch_clause
  all:
    # Bind $ERR to the caught error so that storing it counts as recording.
    # Without a parameter, $ERR binds to the clause, which no assignment can equal.
    - any:
        - has:
            field: parameter
            pattern: $ERR
        - pattern: $ERR
          not:
            has:
              field: parameter
              regex: .
    - has:
        kind: statement_block
        has:
          stopBy: end
          any:
            - kind: return_statement
            - kind: continue_statement
            - kind: break_statement
            - kind: assignment_expression
              not:
                has:
                  field: right
                  pattern: $ERR
            - kind: unary_expression
              regex: ^void\b
        not:
          any:
            - has:
                kind: call_expression
                stopBy: end
            - has:
                kind: throw_statement
                stopBy: end
