id: noop-promise-catch
message: Promise .catch() discards the rejection without reporting or recording it.
severity: error
language: TypeScript
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        has:
          field: property
          regex: ^catch$
    - has:
        field: arguments
        has:
          kind: arrow_function
          not:
            any:
              - has:
                  kind: call_expression
                  stopBy: end
              - has:
                  kind: throw_statement
                  stopBy: end
              - has:
                  kind: new_expression
                  stopBy: end
