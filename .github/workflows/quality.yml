name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Silent-failure gate on changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push whose `before` is the zero sha (a new branch, or the first push of
          # main) has no previous tip. A new branch diffs against its merge-base with
          # main. A fresh main diffs its tip against the parent commit; a root commit
          # with no parent gets the whole-tree report (`--all` lists, never fails).
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              BASE=origin/main
            elif git rev-parse --verify -q HEAD~1 > /dev/null; then
              BASE=HEAD~1
            else
              npm run check:silent:all
              exit $?
            fi
          fi
          npm run check:silent -- --base "$BASE"
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - name: Board shell browser spec
        env:
          E2E_URL: http://127.0.0.1:5377
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5377 --strictPort > "$RUNNER_TEMP/rangeboard-vite.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rangeboard-vite.log"
              exit 1
            fi
            if curl --fail --silent --max-time 1 "$E2E_URL" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/rangeboard-vite.log"
            exit 1
          fi
          npm run test:e2e
